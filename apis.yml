aid: kymera-therapeutics
name: Kymera Therapeutics
description: 'Kymera Therapeutics is a clinical-stage biopharmaceutical company headquartered
  at 500 North Beacon Street in Watertown, Massachusetts, pioneering targeted protein
  degradation as a way to build oral small-molecule medicines against targets that
  conventional inhibitors cannot reach. Rather than blocking a protein''s activity,
  Kymera''s degraders recruit the body''s own protein-disposal machinery so that a
  binding event alone is sufficient to eliminate the disease-driving protein, an approach
  the company describes as a disease-agnostic modality. Its wholly-owned pipeline is
  led by KT-621, a once-daily oral STAT6 degrader in Phase 2 for Type 2 inflammatory
  diseases including atopic dermatitis, asthma, COPD and chronic spontaneous urticaria,
  and KT-579, a first-in-class oral IRF5 degrader in Phase 1 for lupus, Sjogren''s
  syndrome and rheumatoid arthritis. Partnered programs include the oral IRAK4 degrader
  KT-485/SAR447971 with Sanofi and the CDK2 molecular glue degrader KT-200 with Gilead
  Sciences. Kymera publishes no public developer API or developer portal; this profile
  captures the company''s public web, investor, patient and security surface for the
  API Evangelist network.'
